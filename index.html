<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codenames - Cold War Edition</title>
    <script>
        // 1) Decode the SPA redirect from 404.html (turns /?/abc back into /abc).
        // 2) If the path looks like a room name, jump straight to the game.
        (function(l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function(s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
            var path = window.location.pathname.replace(/^\/+|\/+$/g, '');
            if (path && path !== 'index.html') {
                window.location.replace('codenames.html?room=' + encodeURIComponent(path));
            }
        })(window.location);
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            padding: clamp(12px, 3vw, 20px);
            background: #f5f0e8 url('paper-texture.png') repeat;
            background-size: 400px 400px;
            font-family: 'Courier Prime', 'Courier New', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: 'TOP SECRET';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: clamp(50px, 12vw, 120px);
            color: rgba(139, 0, 0, 0.06);
            font-family: 'Special Elite', 'Courier New', monospace;
            pointer-events: none;
            z-index: 0;
            letter-spacing: clamp(8px, 2vw, 20px);
            white-space: nowrap;
        }

        .container {
            max-width: 600px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            padding: clamp(28px, 5vw, 40px) clamp(20px, 4vw, 30px);
            background: #ebe5d9;
            border: 3px solid #a09372;
            position: relative;
            margin-bottom: clamp(20px, 3vw, 30px);
        }

        .header::before {
            content: 'CLASSIFIED';
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: clamp(10px, 1.5vw, 13px);
            color: rgba(139, 0, 0, 0.5);
            font-family: 'Special Elite', 'Courier New', monospace;
            letter-spacing: 3px;
            transform: rotate(8deg);
            border: 2px solid rgba(139, 0, 0, 0.4);
            padding: 4px 10px;
            border-radius: 3px;
            background: rgba(139, 0, 0, 0.05);
        }

        .header::after {
            content: '▲ TOP SECRET ▲';
            position: absolute;
            bottom: 8px;
            left: 15px;
            font-size: 9px;
            color: rgba(139, 0, 0, 0.35);
            font-family: 'Special Elite', 'Courier New', monospace;
            letter-spacing: 2px;
            transform: rotate(-5deg);
        }

        h1 {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(28px, 7vw, 48px);
            color: #2c2c2c;
            letter-spacing: clamp(4px, 1.5vw, 10px);
            margin-bottom: 10px;
            text-transform: uppercase;
            line-height: 1.1;
        }

        .subtitle {
            font-size: clamp(11px, 1.6vw, 14px);
            color: #6b655a;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: clamp(12px, 2vw, 15px);
        }

        .seed-box {
            background: #ebe5d9;
            border: 3px solid #a09372;
            padding: clamp(14px, 2.5vw, 20px) clamp(18px, 3vw, 25px);
            margin-bottom: clamp(12px, 2vw, 15px);
        }

        .seed-label {
            display: block;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(13px, 1.8vw, 15px);
            letter-spacing: clamp(2px, 0.4vw, 3px);
            text-transform: uppercase;
            color: #2c2c2c;
            margin-bottom: 8px;
        }

        .seed-input {
            width: 100%;
            padding: clamp(8px, 1.5vw, 12px) clamp(10px, 2vw, 14px);
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: clamp(13px, 1.8vw, 15px);
            background: #faf6ef;
            border: 2px solid #a09372;
            color: #2c2c2c;
            letter-spacing: 1px;
            outline: none;
        }

        .seed-input:focus { border-color: #2c2c2c; }

        .seed-hint {
            display: block;
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: clamp(10px, 1.3vw, 11px);
            color: #6b655a;
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .menu-item {
            display: block;
            padding: clamp(16px, 2.5vw, 20px) clamp(20px, 3vw, 30px);
            background: #ebe5d9;
            border: 3px solid #a09372;
            text-decoration: none;
            color: #2c2c2c;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(16px, 2.5vw, 20px);
            letter-spacing: clamp(2px, 0.5vw, 4px);
            text-align: center;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            touch-action: manipulation;
        }

        .menu-item:hover {
            background: #2c2c2c;
            color: #f5f0e8;
            border-color: #2c2c2c;
        }

        .menu-item .desc {
            display: block;
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: clamp(10px, 1.4vw, 12px);
            letter-spacing: 1px;
            margin-top: 5px;
            color: #6b655a;
            text-transform: none;
        }

        .menu-item:hover .desc {
            color: #a09372;
        }

        .footer {
            text-align: center;
            margin-top: clamp(20px, 3vw, 30px);
            padding: 15px;
            font-size: clamp(10px, 1.3vw, 11px);
            color: #8c8578;
            letter-spacing: 1px;
            border-top: 2px solid #a09372;
        }

        .stamp-graphic {
            position: fixed;
            top: 20px;
            left: 30px;
            width: clamp(70px, 12vw, 120px);
            height: clamp(70px, 12vw, 120px);
            background: url('top-secret-stamp.webp') no-repeat center;
            background-size: contain;
            opacity: 0.12;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .stamp-graphic-2 {
            position: fixed;
            bottom: 20px;
            right: 30px;
            width: clamp(60px, 10vw, 100px);
            height: clamp(60px, 10vw, 100px);
            background: url('top-secret-stamp.webp') no-repeat center;
            background-size: contain;
            opacity: 0.1;
            transform: rotate(10deg);
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .stamp-graphic, .stamp-graphic-2 { display: none; }
        }
    </style>
</head>
<body>
    <div class="stamp-graphic"></div>
    <div class="stamp-graphic-2"></div>

    <div class="container">
        <div class="header">
            <h1>Codenames</h1>
            <div class="subtitle">Cold War Edition</div>
        </div>

        <div class="seed-box">
            <label class="seed-label" for="seedInput">Mission Code (Room Name)</label>
            <input type="text" id="seedInput" class="seed-input" placeholder="e.g. abc123" autocomplete="off" spellcheck="false">
            <span class="seed-hint">Same code = same synced game. Leave blank for a random room.</span>
        </div>

        <div class="menu">
            <a href="codenames.html" id="startLink" class="menu-item">
                Start Game
                <span class="desc">Play Codenames - Field Operatives Only</span>
            </a>

            <a href="codemasters.html" id="masterLink" target="_blank" class="menu-item">
                Code Masters
                <span class="desc">Spymaster View - Open After Mission Briefing</span>
            </a>
        </div>

        <script>
            (function() {
                const input = document.getElementById('seedInput');
                const startLink = document.getElementById('startLink');
                const masterLink = document.getElementById('masterLink');
                function clean(s) {
                    return (s || '').toLowerCase().trim().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 64);
                }
                function update() {
                    const room = clean(input.value);
                    const q = room ? '?room=' + encodeURIComponent(room) : '';
                    startLink.href = 'codenames.html' + q;
                    masterLink.href = 'codemasters.html' + q;
                }
                input.addEventListener('input', update);
                update();
            })();
        </script>

        <div class="footer">
            CLASSIFIED // EYES ONLY // DO NOT DISTRIBUTE
        </div>
    </div>
</body>
</html>
