<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Codenames</title>
    <script>
        // GitHub Pages SPA redirect: preserve the path through a 404 by encoding
        // it into the query string, then index.html restores it via history.replaceState.
        // pathSegmentsToKeep = 0 for user/organization pages (e.g. user.github.io).
        (function() {
            var pathSegmentsToKeep = 0;
            var l = window.location;
            l.replace(
                l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
                l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
                l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
                (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                l.hash
            );
        })();
    </script>
</head>
<body></body>
</html>
