<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE MASTERS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            padding: clamp(8px, 2vw, 20px);
            background: #f5f0e8 url('paper-texture.png') repeat;
            background-size: 400px 400px;
            font-family: 'Courier Prime', 'Courier New', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
        }

        body::before {
            content: 'CLASSIFIED';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: clamp(50px, 12vw, 100px);
            color: rgba(139, 0, 0, 0.06);
            font-family: 'Special Elite', 'Courier New', monospace;
            pointer-events: none;
            z-index: 0;
            letter-spacing: clamp(8px, 2.5vw, 20px);
            white-space: nowrap;
        }

        h1::before {
            content: 'TOP SECRET';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-5deg);
            font-size: clamp(20px, 5vw, 40px);
            color: rgba(139, 0, 0, 0.15);
            font-family: 'Special Elite', 'Courier New', monospace;
            pointer-events: none;
            letter-spacing: clamp(3px, 1vw, 5px);
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-family: 'Special Elite', 'Courier New', monospace;
            text-align: center;
            margin-bottom: clamp(15px, 3vw, 25px);
            color: #2c2c2c;
            letter-spacing: clamp(3px, 1.2vw, 6px);
            font-size: clamp(22px, 5.5vw, 36px);
            padding: clamp(12px, 2.5vw, 20px);
            background: #ebe5d9;
            border: 2px solid #c4b89c;
            position: relative;
        }

        h1::after {
            content: 'TOP SECRET';
            position: absolute;
            bottom: 5px;
            right: 10px;
            font-size: 9px;
            color: #8b0000;
            letter-spacing: 3px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(3px, 1vw, 10px);
            padding: clamp(6px, 1.5vw, 20px);
            background: #e8e2d4;
            border: 3px solid #a09372;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .card {
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2px, 0.6vw, 10px);
            text-align: center;
            font-size: clamp(8px, 1.6vw, 13px);
            font-weight: bold;
            font-family: 'Courier Prime', 'Courier New', monospace;
            border: 2px solid #a09372;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.1;
            min-width: 0;
        }

        .card.blue { background: #1a3a6e; border-color: #0d1f3c; }
        .card.red { background: #8b0000; border-color: #5c0000; }
        .card.assassin { background: #1a1a1a; border-color: #000; }
        .card.neutral { background: #8c8578; border-color: #6b655a; color: #e8e2d4; }

        .legend {
            margin-top: clamp(15px, 3vw, 25px);
            display: flex;
            flex-wrap: wrap;
            gap: clamp(8px, 2vw, 15px);
            justify-content: center;
            padding: clamp(10px, 2vw, 15px);
            background: #ebe5d9;
            border: 2px solid #c4b89c;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: clamp(10px, 1.6vw, 12px);
            font-weight: bold;
            color: #2c2c2c;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .legend-box {
            width: 18px;
            height: 18px;
            border: 2px solid #a09372;
            flex-shrink: 0;
        }

        .legend-box.blue { background: #1a3a6e; }
        .legend-box.red { background: #8b0000; }
        .legend-box.assassin { background: #1a1a1a; }
        .legend-box.neutral { background: #8c8578; }

        .message {
            text-align: center;
            padding: 30px;
            color: #6b655a;
            font-size: 14px;
            letter-spacing: 1px;
            grid-column: 1/-1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CODE MASTERS</h1>
        <div class="grid" id="masterGrid"></div>
        <div class="legend">
            <div class="legend-item"><div class="legend-box blue"></div> Blue (9)</div>
            <div class="legend-item"><div class="legend-box red"></div> Red (8)</div>
            <div class="legend-item"><div class="legend-box neutral"></div> Neutral (7)</div>
            <div class="legend-item"><div class="legend-box assassin"></div> Assassin (1)</div>
        </div>
    </div>

    <script>
        function renderMasterGrid() {
            const grid = document.getElementById('masterGrid');
            grid.innerHTML = '';

            const words = JSON.parse(localStorage.getItem('codenames_words') || '[]');
            const roles = JSON.parse(localStorage.getItem('codenames_roles') || '[]');

            if (words.length === 0) {
                grid.innerHTML = '<div class="message">No active game.<br>Start a game on the Codenames page first.</div>';
                return;
            }

            words.forEach((word, i) => {
                const card = document.createElement('div');
                card.className = `card ${roles[i]}`;
                card.textContent = word;
                grid.appendChild(card);
            });
        }

        window.addEventListener('storage', function(e) {
            if (e.key && e.key.startsWith('codenames_')) {
                renderMasterGrid();
            }
        });

        window.addEventListener('DOMContentLoaded', renderMasterGrid);

        setInterval(renderMasterGrid, 1000);
    </script>
</body>
</html>
