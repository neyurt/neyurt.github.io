<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codenames</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            padding: clamp(8px, 2vw, 20px);
            background: #f5f0e8 url('paper-texture.png') repeat;
            background-size: 400px 400px;
            font-family: 'Courier Prime', 'Courier New', monospace;
            min-height: 100vh;
            min-height: 100dvh;
            position: relative;
        }

        body::before {
            content: 'TOP SECRET';
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: clamp(50px, 12vw, 120px);
            color: rgba(139, 0, 0, 0.08);
            font-family: 'Special Elite', 'Courier New', monospace;
            pointer-events: none;
            z-index: 0;
            letter-spacing: clamp(8px, 2vw, 20px);
            white-space: nowrap;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: clamp(15px, 3vw, 30px);
            padding: clamp(12px, 2.5vw, 20px);
            background: #ebe5d9;
            border: 2px solid #c4b89c;
            position: relative;
        }

        .header::before {
            content: 'CLASSIFIED';
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: clamp(10px, 1.5vw, 13px);
            color: rgba(139, 0, 0, 0.6);
            font-family: 'Special Elite', 'Courier New', monospace;
            letter-spacing: 3px;
            transform: rotate(8deg);
            border: 2px solid rgba(139, 0, 0, 0.5);
            padding: 4px 10px;
            border-radius: 3px;
            background: rgba(139, 0, 0, 0.08);
        }

        .stamp-graphic {
            position: absolute;
            top: 8px;
            left: 15px;
            width: clamp(60px, 10vw, 100px);
            height: clamp(60px, 10vw, 100px);
            background: url('top-secret-stamp.webp') no-repeat center;
            background-size: contain;
            opacity: 0.15;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        .header::after {
            content: '▲ TOP SECRET ▲';
            position: absolute;
            bottom: 8px;
            left: 15px;
            font-size: 9px;
            color: rgba(139, 0, 0, 0.35);
            font-family: 'Special Elite', 'Courier New', monospace;
            letter-spacing: 2px;
            transform: rotate(-5deg);
        }

        h1 {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(24px, 6vw, 42px);
            color: #2c2c2c;
            letter-spacing: clamp(3px, 1vw, 8px);
            margin-bottom: clamp(8px, 1.5vw, 15px);
            text-transform: uppercase;
        }

        .turn-indicator {
            font-size: clamp(15px, 2.5vw, 20px);
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        .turn-blue { color: #1a3a6e; }
        .turn-red { color: #8b0000; }

        .room-name {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(11px, 1.6vw, 13px);
            color: #6b655a;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .room-name strong { color: #2c2c2c; letter-spacing: 1px; }

        #newGameBtn {
            margin-left: 10px;
            padding: clamp(8px, 1.2vw, 10px) clamp(16px, 2.5vw, 24px);
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: clamp(12px, 1.7vw, 13px);
            font-weight: bold;
            background: #ebe5d9;
            color: #2c2c2c;
            border: 2px solid #a09372;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        #newGameBtn:hover { background: #a09372; color: #f5f0e8; }

        .scores {
            display: flex;
            justify-content: center;
            gap: clamp(20px, 6vw, 60px);
            margin: clamp(12px, 2vw, 20px) 0;
            font-size: clamp(13px, 2vw, 16px);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-blue { color: #1a3a6e; }
        .score-red { color: #8b0000; }

        .end-turn-wrap {
            text-align: center;
            margin-top: clamp(8px, 1.5vw, 12px);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: clamp(3px, 0.8vw, 8px);
            margin-bottom: clamp(15px, 3vw, 30px);
            padding: clamp(6px, 1.5vw, 20px);
            background: #e8e2d4;
            border: 3px solid #a09372;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .card {
            aspect-ratio: 4/3;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: clamp(2px, 0.6vw, 8px);
            text-align: center;
            font-size: clamp(8px, 1.5vw, 13px);
            font-weight: bold;
            font-family: 'Courier Prime', 'Courier New', monospace;
            background: #faf6ef;
            border: 2px solid #a09372;
            cursor: pointer;
            transition: all 0.15s;
            user-select: none;
            -webkit-user-select: none;
            text-transform: uppercase;
            letter-spacing: clamp(0px, 0.2vw, 1px);
            position: relative;
            word-break: break-word;
            overflow-wrap: anywhere;
            line-height: 1.1;
            min-width: 0;
            touch-action: manipulation;
        }

        .card:hover:not(.revealed) {
            background: #f0ebe0;
            border-color: #8b7d5a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .card.revealed {
            cursor: default;
            pointer-events: none;
            color: white;
            border-width: 3px;
        }

        .card.blue { background: #1a3a6e; border-color: #0d1f3c; }
        .card.red { background: #8b0000; border-color: #5c0000; }
        .card.assassin { background: #1a1a1a; border-color: #000; }
        .card.neutral { background: #b8b0a0; color: #4a453f; border-color: #8c8578; }

        #endTurnBtn {
            padding: clamp(10px, 1.5vw, 12px) clamp(24px, 5vw, 40px);
            font-family: 'Courier Prime', 'Courier New', monospace;
            font-size: clamp(13px, 1.8vw, 14px);
            font-weight: bold;
            background: #2c2c2c;
            color: #f5f0e8;
            border: 2px solid #1a1a1a;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            touch-action: manipulation;
        }

        #endTurnBtn:hover { background: #1a1a1a; }

        .master-link {
            text-align: center;
            margin-top: clamp(15px, 2.5vw, 20px);
        }

        .master-link a {
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(14px, 2vw, 18px);
            color: #2c2c2c;
            text-decoration: none;
            padding: clamp(10px, 1.5vw, 12px) clamp(20px, 3vw, 30px);
            border: 3px solid #2c2c2c;
            display: inline-block;
            letter-spacing: clamp(2px, 0.5vw, 4px);
            background: #ebe5d9;
        }

        .master-link a:hover { background: #2c2c2c; color: #f5f0e8; }

        .game-over {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            display: none;
            align-items: center;
            justify-content: center;
            color: #f5f0e8;
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: clamp(20px, 4vw, 32px);
            font-weight: bold;
            z-index: 100;
            letter-spacing: 3px;
            text-align: center;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .game-over::before {
            content: 'TOP SECRET';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: clamp(50px, 12vw, 120px);
            color: rgba(180, 0, 0, 0.12);
            letter-spacing: clamp(10px, 3vw, 30px);
            pointer-events: none;
            font-weight: bold;
            white-space: nowrap;
        }

        .game-over .stamp {
            font-size: clamp(28px, 6vw, 60px);
            color: rgba(139, 0, 0, 0.6);
            border: 6px solid rgba(139, 0, 0, 0.5);
            padding: clamp(12px, 3vw, 20px) clamp(20px, 5vw, 40px);
            transform: rotate(-10deg);
            letter-spacing: clamp(4px, 1.5vw, 8px);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.3;
        }

        @media (max-width: 480px) {
            .stamp-graphic { display: none; }
            .header::before { top: 8px; right: 10px; padding: 3px 6px; }
            .header::after { font-size: 8px; left: 10px; bottom: 6px; }
        }
    </style>
</head>
<body>
    <div class="game-over" id="gameOver"></div>
    <div class="container">
        <div class="stamp-graphic"></div>
        <div class="game-area">
            <div class="header">
                <h1>Codenames</h1>
                <div class="room-name">Room: <strong id="roomName">—</strong></div>
                <div class="turn-indicator">Current Turn: <span id="turnText" class="turn-blue">Blue Team</span></div>
                <div class="scores">
                    <div class="score-blue">Blue: <span id="blueScore">0</span>/9</div>
                    <div class="score-red">Red: <span id="redScore">0</span>/8</div>
                </div>
                <div class="end-turn-wrap">
                    <button id="endTurnBtn">End Turn</button>
                    <button id="newGameBtn">New Game</button>
                </div>
            </div>
            <div class="grid" id="gameGrid"></div>
        </div>
        <div class="master-link">
            <a href="codemasters.html" target="_blank">CODE MASTERS</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="game.js"></script>
    <script>
        // Board (words + roles) is derived locally and deterministically from the room name.
        // Mutable state (revealed cards, turn, scores, gameActive, generation) syncs through Firebase.
        // Bumping `generation` forces all clients to reset the board (used by "New Game").
        let room = '', words = [], roles = [], revealed = Array(25).fill(false);
        let currentTurn = 'blue', scores = { blue: 0, red: 0 }, gameActive = true, generation = 0;
        let stateRef = null, applyingRemote = false;

        function ensureRoom() {
            const r = getRoomFromQuery();
            if (r) return r;
            const generated = randomRoomName();
            window.location.replace('codenames.html?room=' + encodeURIComponent(generated));
            return null;
        }

        function rebuildBoard() {
            const board = buildBoard(room + '#' + generation);
            words = board.words;
            roles = board.roles;
        }

        function defaultState() {
            return {
                revealed: Array(25).fill(false),
                currentTurn: 'blue',
                scores: { blue: 0, red: 0 },
                gameActive: true,
                generation: 0
            };
        }

        function applyRemote(state) {
            applyingRemote = true;
            try {
                const s = state || defaultState();
                generation = typeof s.generation === 'number' ? s.generation : 0;
                revealed = Array.isArray(s.revealed) && s.revealed.length === 25 ? s.revealed.slice() : Array(25).fill(false);
                currentTurn = s.currentTurn === 'red' ? 'red' : 'blue';
                scores = {
                    blue: (s.scores && typeof s.scores.blue === 'number') ? s.scores.blue : 0,
                    red: (s.scores && typeof s.scores.red === 'number') ? s.scores.red : 0
                };
                gameActive = s.gameActive !== false;
                rebuildBoard();
                updateUI();
                refreshGameOverOverlay();
            } finally {
                applyingRemote = false;
            }
        }

        function pushState() {
            if (applyingRemote || !stateRef) return;
            stateRef.set({ revealed, currentTurn, scores, gameActive, generation });
        }

        function updateUI() {
            const turnText = document.getElementById('turnText');
            turnText.className = currentTurn === 'blue' ? 'turn-blue' : 'turn-red';
            turnText.textContent = currentTurn === 'blue' ? 'Blue Team' : 'Red Team';
            document.getElementById('blueScore').textContent = scores.blue;
            document.getElementById('redScore').textContent = scores.red;
            renderGameGrid();
        }

        function renderGameGrid() {
            const grid = document.getElementById('gameGrid');
            grid.innerHTML = '';
            words.forEach((word, i) => {
                const card = document.createElement('div');
                card.className = 'card';
                if (revealed[i]) {
                    card.classList.add('revealed', roles[i]);
                    card.textContent = word;
                } else {
                    card.textContent = word;
                    card.addEventListener('click', () => handleClick(i));
                }
                grid.appendChild(card);
            });
        }

        function handleClick(index) {
            if (!gameActive || revealed[index]) return;
            revealed[index] = true;
            const role = roles[index];
            let endMsg = null, endColor = null;

            if (role === currentTurn) {
                scores[currentTurn]++;
                if (currentTurn === 'blue' && scores.blue === 9) { endMsg = 'Blue Team Wins!'; endColor = '#1a3a6e'; }
                if (currentTurn === 'red' && scores.red === 8) { endMsg = 'Red Team Wins!'; endColor = '#8b0000'; }
            } else if (role === 'assassin') {
                const winner = currentTurn === 'blue'
                    ? { team: 'Red Team', color: '#8b0000' }
                    : { team: 'Blue Team', color: '#1a3a6e' };
                endMsg = `${winner.team} Wins!<br><span style="font-size:24px;margin-top:10px;">Assassin: ${words[index]}</span>`;
                endColor = winner.color;
            } else {
                if (role === 'blue' || role === 'red') {
                    scores[role]++;
                    if (role === 'blue' && scores.blue === 9) { endMsg = 'Blue Team Wins!'; endColor = '#1a3a6e'; }
                    if (role === 'red' && scores.red === 8) { endMsg = 'Red Team Wins!'; endColor = '#8b0000'; }
                }
                if (!endMsg) currentTurn = currentTurn === 'blue' ? 'red' : 'blue';
            }

            if (endMsg) {
                gameActive = false;
                showGameOver(endMsg, endColor);
            }
            updateUI();
            pushState();
        }

        function showGameOver(message, winnerColor) {
            const el = document.getElementById('gameOver');
            const stampColor = winnerColor || 'rgba(139, 0, 0, 0.6)';
            el.innerHTML = `<div class="stamp" style="color: ${stampColor}; border-color: ${stampColor};">${message}</div>`;
            el.style.display = 'flex';
        }

        function refreshGameOverOverlay() {
            // After a remote sync we don't know the original end-of-game text; if the game is
            // still active hide the overlay. If it ended, recompute a reasonable banner.
            const el = document.getElementById('gameOver');
            if (gameActive) {
                el.style.display = 'none';
                return;
            }
            if (scores.blue === 9) return showGameOver('Blue Team Wins!', '#1a3a6e');
            if (scores.red === 8) return showGameOver('Red Team Wins!', '#8b0000');
            // Otherwise it must be an assassin — try to find the revealed assassin word.
            const idx = roles.findIndex((r, i) => r === 'assassin' && revealed[i]);
            if (idx >= 0) {
                const winnerSide = currentTurn === 'blue' ? 'Blue' : 'Red';
                showGameOver(`${winnerSide} Team Wins!<br><span style="font-size:24px;margin-top:10px;">Assassin: ${words[idx]}</span>`,
                    currentTurn === 'blue' ? '#1a3a6e' : '#8b0000');
            } else {
                el.style.display = 'none';
            }
        }

        function endTurn() {
            if (!gameActive) return;
            currentTurn = currentTurn === 'blue' ? 'red' : 'blue';
            updateUI();
            pushState();
        }

        function newGame() {
            generation = (generation || 0) + 1;
            revealed = Array(25).fill(false);
            currentTurn = 'blue';
            scores = { blue: 0, red: 0 };
            gameActive = true;
            rebuildBoard();
            document.getElementById('gameOver').style.display = 'none';
            updateUI();
            pushState();
        }

        window.addEventListener('DOMContentLoaded', function() {
            room = ensureRoom();
            if (!room) return;
            document.getElementById('roomName').textContent = room;
            document.getElementById('masterLink').href = 'codemasters.html?room=' + encodeURIComponent(room);
            document.getElementById('endTurnBtn').addEventListener('click', endTurn);
            document.getElementById('newGameBtn').addEventListener('click', newGame);

            rebuildBoard();
            updateUI();

            stateRef = roomRef(room).child('state');
            stateRef.on('value', function(snap) {
                const val = snap.val();
                if (val === null) {
                    // First visitor seeds the room.
                    stateRef.set(defaultState());
                } else {
                    applyRemote(val);
                }
            });
        });
    </script>
</body>
</html>
